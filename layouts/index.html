{{ define "main" }}
{{ partial "header.html" . }}
<article class="layout">
  <section class="prose introduction">
    {{ .Content }}
  </section>

  <section class="home-posts" aria-labelledby="posts-heading">
    <h2 id="posts-heading" class="section-title">Posts</h2>
    {{ $posts := sort (where .Site.RegularPages "Section" "posts") "Date" "desc" }}
    <div class="post-grid">
      {{ range $posts }}
      <a href="{{ .RelPermalink }}" class="post-card">
        <h3>{{ .Title }}</h3>
        <p class="post-meta">
          <time datetime="{{ .Date.Format `2006-01-02` }}">{{ .Date.Format "Jan 2006" }}</time>
          <!-- {{ with .Params.tags }}
            <span class="tag-list">
              {{ range first 5 . }}<span class="tag">{{ . }}</span>{{ end }}
            </span>
          {{ end }} -->
        </p>
      </a>
      {{ end }}
    </div>
  </section>
</article>
{{ end }}
